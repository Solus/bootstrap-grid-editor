name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The tag drives the release; the .vsix version comes from the extension
      # package.json — they must match (CLAUDE.md → "Releasing a version").
      - name: Verify tag matches extension version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(node -p "require('./packages/app-extension/package.json').version")"
          if [ "$TAG" != "$VER" ]; then
            echo "Tag v$TAG does not match extension version $VER"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build standalone single-file HTML
        run: npm run build:single

      - name: Build extension VSIX
        run: npm run vsix -w bootstrap-visualizer-extension

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp packages/app-standalone/dist-single/index.html "artifacts/bootstrap-visualizer-${GITHUB_REF_NAME}.html"
          cp packages/app-extension/releases/*.vsix artifacts/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
