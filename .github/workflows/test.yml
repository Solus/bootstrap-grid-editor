name: Test

on:
  # Tags are handled by release.yml, which runs this same suite as its gate —
  # excluded here so a release tag doesn't run every layer twice in parallel.
  push:
    tags-ignore:
      - 'v*'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # tsc -b also emits packages/core/dist, which the app + jsdom tests import
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (Vitest + jsdom)
        run: npm test

      # The one layer the unit tests can't reach: canvas offsets applied to a
      # real VS Code buffer (FOLLOW-UPS §7.5). Needs a display — VS Code is an
      # Electron app even when driving it headlessly.
      - name: Integration tests (real VS Code)
        run: xvfb-run -a npm run test:vscode

      - name: Install Playwright browsers
        # all three engines (FOLLOW-UPS §3.3) — drag & drop and pointer
        # capture are the interactions most likely to differ across engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: End-to-end tests (Playwright)
        run: npm run test:e2e
