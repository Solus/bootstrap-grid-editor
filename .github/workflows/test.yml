name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # tsc -b also emits packages/core/dist, which the app + jsdom tests import
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (Vitest + jsdom)
        run: npm test

      - name: Install Playwright browsers
        # all three engines (FOLLOW-UPS §3.3) — drag & drop and pointer
        # capture are the interactions most likely to differ across engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: End-to-end tests (Playwright)
        run: npm run test:e2e
